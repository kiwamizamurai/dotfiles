<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dotfiles — macOS の開発環境</title>
<meta name="description" content="macOS の開発環境。Stow で束ね、一行で入る。Neovim・WezTerm・Starship・Atuin・opencode の設定と、Brewfile。">
<meta property="og:title" content="dotfiles — macOS の開発環境">
<meta property="og:description" content="Stow で束ね、一行で入る。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#15130f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23c23a22'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23f1ece0' font-family='serif'%3E庵%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/intro.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/responsive.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<header>
  <a class="brand" href="./"><span class="seal" aria-hidden="true">庵</span><span>dotfiles</span></a>
  <div class="links"><a href="https://github.com/kiwamizamurai/dotfiles" target="_blank" rel="noopener">github</a></div>
</header>

<!-- 序 -->
<section id="intro" aria-label="序">
  <div class="editor">
    <div class="hashira" id="hashira"><span id="hpath">序</span><span class="pos" id="pos"></span></div>
    <div class="tanzaku" id="cmd" aria-live="polite"></div>
    <div class="code" id="code"></div>
  </div>
</section>
<canvas id="eye" width="520" height="260" aria-hidden="true"></canvas>
<div class="readout" id="ro" aria-hidden="true"></div>

<!-- 破 -->
<section id="site" aria-label="本編">
  <canvas id="ink" aria-hidden="true"></canvas>
  <div class="rail" id="rail"></div>
  <div class="pointer" id="ptr"></div>
  <div class="divider"></div>
  <div class="term">
    <div class="ttl">帳面 — dotfiles</div>
    <div class="frame">
      <div class="hd">七つの束が、ひとつの庭になる<small>一つの束 ＝ 一つの道具の設定</small></div>
      <canvas id="ridge" aria-hidden="true"></canvas>
      <div class="side">
        <h4>断面 A–A <em>静けさの余韻</em></h4>
        <div class="prof"><svg viewBox="0 0 290 80" preserveAspectRatio="none"><path id="prof" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.2" d=""/></svg></div>
        <div class="cuts">最終更新 二〇二六・十・三</div>
        <table>
          <tr class="h"><td colspan="2">数の写し</td></tr>
          <tr><td>束</td><td id="n1">〇</td></tr>
          <tr><td>道具</td><td id="n2">〇</td></tr>
          <tr><td>アプリ</td><td id="n3">〇</td></tr>
          <tr><td>書体</td><td id="n4">〇</td></tr>
          <tr><td>設定</td><td id="gr">〇</td></tr>
          <tr><td>星</td><td id="rc">〇</td></tr>
        </table>
        <div class="scale">
          <div><span>packages/</span><span>七つの束</span></div>
          <svg viewBox="0 0 280 60" fill="none" stroke="var(--ink)" stroke-width="1" color="var(--ink)"><g id="fam"></g></svg>
        </div>
      </div>
      <div class="axis"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    </div>
    <div class="prompt" id="prompt"></div>
  </div>
  <div class="bar">
    <p class="bar-id"><span class="bar-title">dotfiles</span><span class="bar-sub" id="cwd"></span></p>
    <div class="bar-cols" id="cols"></div>
    <button class="den" id="den" aria-label="目を閉じる"><span class="seal" aria-hidden="true">印</span></button>
    <p class="bar-graph"><span class="label">言語</span><span class="value" id="vis">Lua</span></p>
  </div>
</section>

<div id="deck" aria-hidden="true">
  <div id="keys"></div>
  <canvas id="hands" width="1280" height="500"></canvas>
</div>
<canvas id="line" aria-hidden="true"></canvas>

<footer>
  <span>Stow で結び、一行で入る。</span>
  <div class="hint"><button id="themeBtn">彩 ・ 色替え</button><button class="kbd" id="enter">入る ↵</button></div>
</footer>

<!-- JavaScript が使えない場合・検索エンジン向けの、飾りのない本文 -->
<noscript>
  <main class="plain">
    <h1>dotfiles</h1>
    <p>macOS の開発環境。Stow で束ね、一行で入る。</p>
    <h2>入れ方</h2>
    <pre>/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/kiwamizamurai/dotfiles/refs/heads/main/install.sh)"</pre>
    <h2>中身</h2>
    <ul>
      <li>packages/: nvim・wezterm・zsh・starship・atuin・opencode・github（Stow で結ぶ）</li>
      <li>Brewfile: brew 78・cask 41・tap 4</li>
      <li>USAGE.md: Neovim 設定の手引き</li>
    </ul>
    <p><a href="https://github.com/kiwamizamurai/dotfiles">GitHub のリポジトリ</a></p>
  </main>
</noscript>
</body>
</html>
