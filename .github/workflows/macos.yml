name: macOS Install Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-test:
    # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # https://github.com/actions/setup-python/issues/577
      - name: Deal with Python symlink bug
        run: |
          rm -f /usr/local/bin/2to3 || true
          rm -f /usr/local/bin/2to3-3.12 || true

      - name: Trust non-official taps
        run: |
          brew trust --tap nikitabobko/tap
          brew trust --tap charmbracelet/tap
          brew trust --tap productdevbook/tap
          brew trust --tap tw93/tap
          brew trust --tap supabase/tap
          brew trust --tap aws/tap

      - name: Run brew bundle
        run: brew bundle --verbose
        env:
          HOMEBREW_BUNDLE_BREW_SKIP: "awscli"
          HOMEBREW_BUNDLE_CASK_SKIP: "makemkv"

      - name: Create ~/.config directory
        run: mkdir -p "$HOME/.config"

      - name: Test stow symlinks
        run: |
          for pkg in starship wezterm atuin github zsh nvim; do
            echo "Stowing $pkg..."
            stow --verbose -d packages -t "$HOME" "$pkg"
          done

      - name: Verify symlinks created
        run: |
          echo "Checking symlinks..."
          ls -la "$HOME/.config/" || true
          ls -la "$HOME/.zshrc" || true
          ls -la "$HOME/.gitconfig" || true
          ls -la "$HOME/.wezterm.lua" || true
